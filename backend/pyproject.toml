[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritasai-backend"
version = "0.1.0"
description = "VeritasAI — Multilingual Fake News Detection and Sentiment Analysis API"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vikas" }]

dependencies = [
    # ── Web Framework ──
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # ── Validation & Settings ──
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # ── Auth ──
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # ── Cache ──
    "redis[hiredis]>=5.0.0",

    # ── Logging ──
    "structlog>=24.1.0",

    # ── HTTP Client ──
    "httpx>=0.27.0",

    # ── AI/ML (installed separately for size) ──
    # "torch>=2.3.0",
    # "transformers>=4.41.0",
    # "onnxruntime>=1.18.0",
    # "lime>=0.2.0",
    # "langdetect>=1.0.9",

    # ── Utilities ──
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    # ── Testing ──
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",

    # ── Linting & Formatting ──
    "ruff>=0.4.0",
    "mypy>=1.10.0",

    # ── Type Stubs ──
    "types-passlib>=1.7.0",
    "types-python-jose>=3.3.0",
]

ai = [
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "onnxruntime>=1.18.0",
    "lime>=0.2.0",
    "langdetect>=1.0.9",
    "newspaper3k>=0.2.8",
    "beautifulsoup4>=4.12.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0",
    "sentencepiece>=0.2.0",
]

notebooks = [
    "jupyter>=1.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "datasets>=2.14.0",
    "ipywidgets>=8.0.0",
]

# ── Ruff ──
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no print statements)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # allow Depends() in function defaults (FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Mypy ──
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["redis.*", "structlog.*", "jose.*", "passlib.*"]
ignore_missing_imports = true

# ── Pytest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-v --tb=short"
