# ──────────────────────────────────────────────
# VeritasAI — Production Docker Compose Orchestration
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ──────────────────────────────────────────────

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: veritasai-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veritas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-veritasai}
    # No public port mapping in production for network isolation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritas} -d ${POSTGRES_DB:-veritasai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veritasai-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Redis Cache & Rate Limiting ──
  redis:
    image: redis:7-alpine
    container_name: veritasai-prod-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veritasai-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Backend API (FastAPI + Gunicorn + Uvicorn) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veritasai-prod-backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veritas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-veritasai}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_ENABLED: "true"
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    volumes:
      # Mount model directory in read-only mode (weights persisted across restarts)
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - veritasai-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Frontend (Vite Production Build served by Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veritasai-prod-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - veritasai-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Reverse Proxy Gateway & Edge Load Balancer ──
  nginx:
    image: nginx:alpine
    container_name: veritasai-prod-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - veritasai-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
    name: veritasai-prod-postgres-data
  redis_data:
    name: veritasai-prod-redis-data

networks:
  veritasai-prod-network:
    name: veritasai-prod-network
    driver: bridge
